name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: 'Prepare workflow'
    uses: eliashaeussler/gha/.github/workflows/preparation.yaml@d0c78d2dd7f2d10ec208b4de6a1bab02cd89ab43 # 1.1.26

  checks:
    name: 'Checks'

    needs: [prepare]
    if: ${{ needs.prepare.outputs.continue == 'true' }}

    permissions:
      contents: read
      security-events: write

    uses: eliashaeussler/gha/.github/workflows/checks.yaml@d0c78d2dd7f2d10ec208b4de6a1bab02cd89ab43 # 1.1.26
    with:
      composer: false

  python-checks:
    name: 'Perform Python checks'
    runs-on: ubuntu-latest

    needs: [prepare]
    if: ${{ needs.prepare.outputs.continue == 'true' }}

    permissions:
      contents: read

    steps:
      - name: 'Checkout'
        uses: eliashaeussler/gha/.github/actions/checkout@d0c78d2dd7f2d10ec208b4de6a1bab02cd89ab43 # 1.1.26

      - name: 'Setup Python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3
          cache: 'pip'

      - name: 'Install dependencies'
        run: pip install -r bridge/requirements.txt -r bridge/requirements-dev.txt

      - name: 'Lint Editorconfig'
        run: ec -verbose

      - name: 'Lint Python files'
        run: pylint bridge/*.py

      - name: 'Lint shell files'
        run: bash -c 'shopt -s globstar nullglob; shellcheck *.sh'
