services:
  bridge:
    build: bridge
    networks:
      - default

  prometheus:
    image: prom/prometheus
    networks:
      - default
    ports:
      - "127.0.0.1:9773:9090"
    volumes:
      - './prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './data/prometheus:/prometheus'
    depends_on:
      - bridge

  grafana:
    build: grafana
    networks:
      - default
    ports:
      - "127.0.0.1:9772:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/train-data.json
    volumes:
      - './grafana/provisioning:/etc/grafana/provisioning:ro'
      - './data/grafana:/var/lib/grafana'
    depends_on:
      - bridge
      - prometheus

networks:
  default:
